name: release

# Tag a version to ship it:
#   git tag v0.1.0 && git push origin v0.1.0
# This builds all platform binaries, publishes a GitHub Release, and updates the
# Nix flake (nix/release.nix) on main so `nix run` tracks the new release.
#
# Security note: the only workflow inputs used are the built-in GITHUB_REF_NAME
# (the tag, maintainer-controlled) and github.token. GITHUB_REF_NAME is consumed
# as a shell environment variable and always quoted — no untrusted event text
# (issue/PR/commit bodies) is interpolated into any run: step.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all targets
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for entry in \
            "bun-linux-x64:cc-linux-x64" \
            "bun-linux-arm64:cc-linux-arm64" \
            "bun-darwin-x64:cc-darwin-x64" \
            "bun-darwin-arm64:cc-darwin-arm64"; do
            target="${entry%%:*}"
            out="${entry##*:}"
            echo "building $out ($target)"
            bun build --compile --target="$target" \
              --define BUILD_VERSION="\"$VERSION\"" \
              src/index.ts --outfile "dist/$out"
          done

      - name: Generate checksums
        working-directory: dist
        run: sha256sum cc-* > checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Bump the Nix flake to this release
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          h() { grep " $1\$" dist/checksums.txt | awk '{print $1}'; }
          git fetch origin main
          git checkout -B main origin/main
          cat > nix/release.nix <<EOF
          # Auto-generated by .github/workflows/release.yml on each tagged release.
          # Do not edit by hand — changes are overwritten on the next release.
          {
            version = "$VERSION";
            hashes = {
              "x86_64-linux" = "$(h cc-linux-x64)";
              "aarch64-linux" = "$(h cc-linux-arm64)";
              "x86_64-darwin" = "$(h cc-darwin-x64)";
              "aarch64-darwin" = "$(h cc-darwin-arm64)";
            };
          }
          EOF

      - name: Commit the flake bump
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nix/release.nix
          if git diff --cached --quiet; then
            echo "flake already current"
          else
            git commit -m "chore(release): ${GITHUB_REF_NAME} flake hashes [skip ci]"
            git push origin main
          fi
