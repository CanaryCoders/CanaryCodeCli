name: release

# Tag a version to ship it:
#   git tag v0.1.0 && git push origin v0.1.0
# This builds all platform binaries, publishes a GitHub Release whose notes are
# the tag's section of CHANGELOG.md (add one before tagging — the job fails
# without it), and updates the Nix flake (nix/release.nix) on main so `nix run`
# tracks the new release. The CLI surfaces those notes via `canarycode changelog` and
# the post-update what's-new banner.
#
# Security note: the only workflow inputs used are the built-in GITHUB_REF_NAME
# (the tag, maintainer-controlled) and github.token. GITHUB_REF_NAME is consumed
# as a shell environment variable and always quoted — no untrusted event text
# (issue/PR/commit bodies) is interpolated into any run: step.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # @opentui/core loads a per-platform native package; a default install only
      # brings the runner's own platform, which breaks cross-compiling the other
      # targets. Pull the native packages for every OS/arch so `bun build
      # --compile` can embed the right one per target.
      - name: Install OpenTUI native packages for all targets
        run: |
          set -eu
          VER=$(bun -e 'import pkg from "@opentui/core/package.json"; console.log(pkg.version)')
          bun install --os='*' --cpu='*' "@opentui/core@$VER"

      - name: Build all targets
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for entry in \
            "bun-linux-x64:canarycode-linux-x64" \
            "bun-linux-arm64:canarycode-linux-arm64" \
            "bun-darwin-x64:canarycode-darwin-x64" \
            "bun-darwin-arm64:canarycode-darwin-arm64"; do
            target="${entry%%:*}"
            out="${entry##*:}"
            echo "building $out ($target)"
            bun build --compile --target="$target" \
              --define BUILD_VERSION="\"$VERSION\"" \
              src/index.ts --outfile "dist/$out"
          done

      - name: Generate checksums
        working-directory: dist
        run: sha256sum canarycode-* > checksums.txt

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}" bun -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { extractChangelog } from "./src/update.ts";
            const notes = extractChangelog(
              readFileSync("CHANGELOG.md", "utf8"),
              process.env.VERSION ?? "",
            );
            if (!notes) {
              console.error(`no CHANGELOG.md section for ${process.env.VERSION}`);
              process.exit(1);
            }
            writeFileSync("release-notes.md", notes);
          '

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md

      - name: Bump the Nix flake to this release
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          h() { grep " $1\$" dist/checksums.txt | awk '{print $1}'; }
          git fetch origin main
          git checkout -B main origin/main
          cat > nix/release.nix <<EOF
          # Auto-generated by .github/workflows/release.yml on each tagged release.
          # Do not edit by hand — changes are overwritten on the next release.
          {
            version = "$VERSION";
            hashes = {
              "x86_64-linux" = "$(h canarycode-linux-x64)";
              "aarch64-linux" = "$(h canarycode-linux-arm64)";
              "x86_64-darwin" = "$(h canarycode-darwin-x64)";
              "aarch64-darwin" = "$(h canarycode-darwin-arm64)";
            };
          }
          EOF

      - name: Commit the flake bump
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nix/release.nix
          if git diff --cached --quiet; then
            echo "flake already current"
          else
            git commit -m "chore(release): ${GITHUB_REF_NAME} flake hashes [skip ci]"
            git push origin main
          fi
